<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSA Conference Booth Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #003DA5;
      --blue-dark: #002580;
      --blue-light: #e8eef8;
      --accent: #E8251F;
      --gray: #f4f5f7;
      --border: #dde1ea;
      --text: #1a1d24;
      --muted: #6b7280;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--gray);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--blue);
      color: white;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    header h1 {
      font-size: 15px;
      font-weight: 500;
      opacity: 0.85;
      border-left: 1px solid rgba(255,255,255,0.3);
      padding-left: 16px;
    }

    /* Controls */
    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #search {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,61,165,0.1); }

    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: white;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
    .filter-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

    .sort-select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      background: white;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: var(--blue); }

    /* Main */
    main { padding: 24px; }

    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .results-count { font-size: 14px; color: var(--muted); }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 0.15s, transform 0.15s;
      cursor: pointer;
      position: relative;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .company-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--blue-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--blue);
      flex-shrink: 0;
    }
    .booth-badge {
      background: var(--blue);
      color: white;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .company-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 6px;
    }
    .category-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }
    .hall-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 2px;
    }
    .hall-row svg { flex-shrink: 0; }

    /* Category colors */
    .cat-cloud { background: #dbeafe; color: #1d4ed8; }
    .cat-endpoint { background: #dcfce7; color: #15803d; }
    .cat-network { background: #fef9c3; color: #854d0e; }
    .cat-identity { background: #fce7f3; color: #9d174d; }
    .cat-siem { background: #ede9fe; color: #6d28d9; }
    .cat-grc { background: #ffedd5; color: #c2410c; }
    .cat-appsec { background: #e0f2fe; color: #0369a1; }
    .cat-threat { background: #fee2e2; color: #991b1b; }
    .cat-data { background: #f0fdf4; color: #166534; }
    .cat-ai { background: #fdf4ff; color: #7e22ce; }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty h3 { font-size: 18px; margin-bottom: 6px; color: var(--text); }

    /* Modal */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--gray);
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .modal-close:hover { background: var(--border); color: var(--text); }
    .modal-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: var(--blue-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: var(--blue);
      margin-bottom: 14px;
    }
    .modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .modal-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .modal-booth {
      background: var(--blue);
      color: white;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .modal-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .info-item {
      background: var(--gray);
      border-radius: 8px;
      padding: 12px;
    }
    .info-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .info-value { font-size: 14px; font-weight: 600; }
    .tags-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { background: var(--blue-light); color: var(--blue); padding: 4px 10px; border-radius: 12px; font-size: 12px; }

    @media (max-width: 600px) {
      .controls { padding: 12px 16px; }
      main { padding: 16px; }
      header h1 { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">RSA<span>•</span>2025</div>
  <h1>Expo Booth Finder</h1>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="search" placeholder="Search companies, products, keywords..." autocomplete="off" />
  </div>

  <div class="filter-group" id="filters">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="Cloud Security">Cloud</button>
    <button class="filter-btn" data-cat="Endpoint">Endpoint</button>
    <button class="filter-btn" data-cat="Network Security">Network</button>
    <button class="filter-btn" data-cat="Identity">Identity</button>
    <button class="filter-btn" data-cat="SIEM & Analytics">SIEM</button>
    <button class="filter-btn" data-cat="GRC">GRC</button>
    <button class="filter-btn" data-cat="AppSec">AppSec</button>
    <button class="filter-btn" data-cat="Threat Intel">Threat Intel</button>
    <button class="filter-btn" data-cat="AI Security">AI</button>
  </div>

  <select class="sort-select" id="sort">
    <option value="booth">Sort: Booth #</option>
    <option value="name">Sort: Company A–Z</option>
    <option value="hall">Sort: Hall</option>
  </select>
</div>

<main>
  <div class="results-bar">
    <div class="results-count" id="count">Loading…</div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <div class="modal-logo" id="m-logo"></div>
    <h2 id="m-name"></h2>
    <div class="modal-meta">
      <span class="modal-booth" id="m-booth"></span>
      <span class="category-tag" id="m-cat"></span>
    </div>
    <p class="modal-desc" id="m-desc"></p>
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Hall</div>
        <div class="info-value" id="m-hall"></div>
      </div>
      <div class="info-item">
        <div class="info-label">Booth Size</div>
        <div class="info-value" id="m-size"></div>
      </div>
      <div class="info-item">
        <div class="info-label">Booth Number</div>
        <div class="info-value" id="m-boothnum"></div>
      </div>
      <div class="info-item">
        <div class="info-label">Category</div>
        <div class="info-value" id="m-catval"></div>
      </div>
    </div>
    <div class="info-label" style="margin-bottom:8px">Products &amp; Solutions</div>
    <div class="tags-list" id="m-tags"></div>
  </div>
</div>

<script>
const BOOTHS = [
  { booth:"1135", name:"CrowdStrike", cat:"Endpoint", hall:"North Expo", size:"Island (40×40)", abbr:"CS", desc:"AI-native platform stopping breaches across endpoint, cloud, identity, and data. Visit to see the Falcon platform live with next-gen SIEM.", tags:["Falcon Platform","EDR/XDR","Threat Hunting","Identity Protection","Cloud Security"] },
  { booth:"4424", name:"Palo Alto Networks", cat:"Network Security", hall:"South Expo", size:"Island (50×50)", abbr:"PA", desc:"Cybersecurity leader offering the industry's most complete platform — SASE, Prisma Cloud, and Cortex — to prevent successful cyberattacks.", tags:["SASE","Prisma Cloud","Cortex XDR","AI-Powered SOC","Zero Trust"] },
  { booth:"3220", name:"Microsoft Security", cat:"SIEM & Analytics", hall:"South Expo", size:"Island (40×40)", abbr:"MS", desc:"Microsoft Sentinel, Defender XDR, and Entra ID on display — unified security operations powered by Microsoft Copilot for Security.", tags:["Microsoft Sentinel","Defender XDR","Entra ID","Copilot for Security","Purview"] },
  { booth:"2150", name:"Wiz", cat:"Cloud Security", hall:"North Expo", size:"Large (30×30)", abbr:"WZ", desc:"The cloud security platform trusted by 40% of Fortune 100. Demos include CNAPP, AI-SPM, and new Wiz Code capabilities.", tags:["CNAPP","Cloud Posture","AI-SPM","Code Security","Runtime Protection"] },
  { booth:"1540", name:"SentinelOne", cat:"Endpoint", hall:"North Expo", size:"Large (30×30)", abbr:"S1", desc:"Autonomous cybersecurity at machine speed. Experience Singularity Platform — AI-powered prevention, detection, and response.", tags:["Singularity Platform","Purple AI","XDR","Threat Intelligence","Cloud Workload"] },
  { booth:"3310", name:"Okta", cat:"Identity", hall:"South Expo", size:"Large (30×30)", abbr:"OK", desc:"The World's Identity Company. See how Okta Identity Security Posture Management and AI-driven threat detection secure modern enterprises.", tags:["ISPM","Workforce Identity","Customer Identity","Passwordless","Identity Governance"] },
  { booth:"2840", name:"Fortinet", cat:"Network Security", hall:"North Expo", size:"Island (40×40)", abbr:"FN", desc:"Securing the converged network. Explore FortiGate, FortiSASE, and the unified Security Fabric that spans network, endpoint, and cloud.", tags:["FortiGate","FortiSASE","Security Fabric","SD-WAN","OT Security"] },
  { booth:"4110", name:"Zscaler", cat:"Cloud Security", hall:"South Expo", size:"Large (30×30)", abbr:"ZS", desc:"Zero Trust Exchange — the world's largest security cloud. See how Zscaler eliminates attack surface and stops lateral movement.", tags:["Zero Trust Exchange","ZTNA","ZIA","ZPA","Data Protection"] },
  { booth:"1820", name:"Splunk", cat:"SIEM & Analytics", hall:"North Expo", size:"Large (30×30)", abbr:"SP", desc:"Unified security and observability with Splunk Enterprise Security, SOAR, and the new AI Assistant for accelerated threat detection.", tags:["Enterprise Security","SOAR","UEBA","Observability","Mission Control"] },
  { booth:"3650", name:"Cisco Security", cat:"Network Security", hall:"South Expo", size:"Island (50×50)", abbr:"CI", desc:"Security resilience powered by AI. Demonstrations of Cisco XDR, Hypershield, and the Splunk-integrated security cloud.", tags:["Cisco XDR","Hypershield","Duo","Umbrella","Secure Firewall"] },
  { booth:"2230", name:"IBM Security", cat:"SIEM & Analytics", hall:"North Expo", size:"Large (30×30)", abbr:"IB", desc:"AI-powered security operations with IBM QRadar SIEM, SOAR, and Guardium data security. Ask about the IBM X-Force threat intel partnership.", tags:["QRadar SIEM","X-Force","Guardium","SOAR","Identity Security"] },
  { booth:"1420", name:"Tenable", cat:"GRC", hall:"North Expo", size:"Large (30×30)", abbr:"TN", desc:"The exposure management company. See Tenable One platform, OT Security, and new AI-powered risk prioritization workflows.", tags:["Exposure Management","Nessus","OT Security","Cloud Security","Attack Path Analysis"] },
  { booth:"4520", name:"Qualys", cat:"GRC", hall:"South Expo", size:"Medium (20×20)", abbr:"QL", desc:"Cloud-based IT, security, and compliance platform. Demos include TotalCloud CNAPP, VMDR, and the AI-powered Enterprise TruRisk platform.", tags:["TruRisk","VMDR","CNAPP","Policy Compliance","Web App Scanning"] },
  { booth:"2760", name:"Rapid7", cat:"GRC", hall:"North Expo", size:"Medium (20×20)", abbr:"R7", desc:"Threat exposure management and detection & response. See InsightVM, InsightIDR, and the managed detection offering.", tags:["InsightVM","InsightIDR","MDR","Application Security","Threat Intelligence"] },
  { booth:"3480", name:"Cyberark", cat:"Identity", hall:"South Expo", size:"Large (30×30)", abbr:"CA", desc:"The identity security company. Stop privilege-based attacks with CyberArk Identity Security Platform — PAM, secrets, endpoint privilege.", tags:["PAM","Secrets Management","Workforce Identity","Endpoint Privilege","CIEM"] },
  { booth:"1650", name:"Lacework", cat:"Cloud Security", hall:"North Expo", size:"Medium (20×20)", abbr:"LW", desc:"Polygraph Data Platform for cloud security — CSPM, CWPP, IaC scanning, and anomaly detection powered by machine learning.", tags:["CNAPP","CSPM","CWPP","IaC Security","Anomaly Detection"] },
  { booth:"4240", name:"Proofpoint", cat:"Threat Intel", hall:"South Expo", size:"Large (30×30)", abbr:"PP", desc:"Human-centric cybersecurity. Protecting people, data, and brands against email threats, insider risk, and data loss.", tags:["Email Security","DLP","Insider Risk","Security Awareness","CASB"] },
  { booth:"2080", name:"Darktrace", cat:"AI Security", hall:"North Expo", size:"Medium (20×20)", abbr:"DT", desc:"AI cybersecurity that learns your organization. See ActiveAI Security Platform — self-learning AI for email, cloud, OT, and SOC.", tags:["Self-Learning AI","Email Security","OT Security","Cloud Security","SOC AI"] },
  { booth:"3120", name:"Varonis", cat:"Data Security", hall:"South Expo", size:"Medium (20×20)", abbr:"VR", desc:"Data security and analytics platform that detects insider threats and cyberattacks by analyzing data access and user behavior.", tags:["Data Security","DSPM","Insider Threat","UEBA","Least Privilege"] },
  { booth:"1910", name:"Snyk", cat:"AppSec", hall:"North Expo", size:"Medium (20×20)", abbr:"SN", desc:"Developer-first security — find and fix vulnerabilities in code, open source, containers, and IaC. Now with AI fixes.", tags:["SAST","SCA","Container Security","IaC Security","AI Fixes"] },
  { booth:"4360", name:"Checkmarx", cat:"AppSec", hall:"South Expo", size:"Medium (20×20)", abbr:"CX", desc:"Enterprise AppSec platform covering SAST, SCA, DAST, and API security with AI-powered remediation integrated into the SDLC.", tags:["SAST","DAST","SCA","API Security","AI Remediation"] },
  { booth:"2420", name:"Veracode", cat:"AppSec", hall:"North Expo", size:"Medium (20×20)", abbr:"VC", desc:"Application security testing platform trusted by 2,500+ companies. Explore static, dynamic, SCA, and now AI-assisted code review.", tags:["SAST","DAST","SCA","Penetration Testing","Fix Guidance"] },
  { booth:"1280", name:"Abnormal Security", cat:"Threat Intel", hall:"North Expo", size:"Medium (20×20)", abbr:"AB", desc:"AI email security that stops business email compromise, account takeover, and supply chain attacks by understanding human behavior.", tags:["Email BEC","Account Takeover","Supply Chain","AI Behavioral","Autonomous SOC"] },
  { booth:"3740", name:"Lacework FortiCNAPP", cat:"Cloud Security", hall:"South Expo", size:"Small (10×10)", abbr:"LC", desc:"Unified cloud-native application protection combining Lacework's data platform with Fortinet's threat intelligence.", tags:["CNAPP","Runtime Protection","Threat Intel","Cloud Posture"] },
  { booth:"2610", name:"Sailpoint", cat:"Identity", hall:"North Expo", size:"Large (30×30)", abbr:"SI", desc:"Identity security platform for enterprise — intelligent access reviews, entitlement management, and AI-driven non-human identity protection.", tags:["Identity Governance","Access Reviews","ITSM","Non-Human Identity","AI Governance"] },
  { booth:"4080", name:"Secureworks", cat:"Threat Intel", hall:"South Expo", size:"Medium (20×20)", abbr:"SW", desc:"Taegis XDR and MDR services backed by Counter Threat Unit research. Live threat hunting demonstrations every hour.", tags:["XDR","MDR","Threat Hunting","CTU Research","Vulnerability Management"] },
  { booth:"1740", name:"Menlo Security", cat:"Network Security", hall:"North Expo", size:"Small (10×10)", abbr:"MN", desc:"Secure cloud browser — isolate every web session and eliminate malware, phishing, and data loss without impacting the user experience.", tags:["Browser Isolation","ZTNA","CASB","DLP","Phishing Prevention"] },
  { booth:"3960", name:"Orca Security", cat:"Cloud Security", hall:"South Expo", size:"Medium (20×20)", abbr:"OR", desc:"Agentless cloud security that covers the entire cloud estate — vulnerabilities, misconfigurations, data exposure, and AI workloads.", tags:["Agentless CNAPP","DSPM","AI Security","Attack Path","Compliance"] },
  { booth:"2530", name:"Delinea", cat:"Identity", hall:"North Expo", size:"Medium (20×20)", abbr:"DL", desc:"Privileged Access Management built for the cloud era — secret server, privilege manager, and cloud suite for seamless least-privilege.", tags:["PAM","Secrets Manager","Cloud Privilege","Zero Trust","DevOps Security"] },
  { booth:"1345", name:"Recorded Future", cat:"Threat Intel", hall:"North Expo", size:"Medium (20×20)", abbr:"RF", desc:"The world's largest threat intelligence company powered by AI. Real-time intelligence across dark web, technical, and open sources.", tags:["Threat Intelligence","Dark Web","Attack Surface","SOAR Integration","Risk Scoring"] },
];

const CAT_CLASS = {
  "Cloud Security":"cat-cloud","Endpoint":"cat-endpoint","Network Security":"cat-network",
  "Identity":"cat-identity","SIEM & Analytics":"cat-siem","GRC":"cat-grc",
  "AppSec":"cat-appsec","Threat Intel":"cat-threat","Data Security":"cat-data","AI Security":"cat-ai"
};

let query = "", activeFilter = "all", sortBy = "booth";

function initials(name) {
  const words = name.split(" ");
  return words.length >= 2 ? (words[0][0]+words[1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}

function filtered() {
  let list = BOOTHS.filter(b => {
    const q = query.toLowerCase();
    const matchQ = !q || b.name.toLowerCase().includes(q) || b.cat.toLowerCase().includes(q) ||
      b.desc.toLowerCase().includes(q) || b.tags.some(t => t.toLowerCase().includes(q)) ||
      b.booth.includes(q) || b.hall.toLowerCase().includes(q);
    const matchF = activeFilter === "all" || b.cat === activeFilter;
    return matchQ && matchF;
  });

  list.sort((a, b) => {
    if (sortBy === "name") return a.name.localeCompare(b.name);
    if (sortBy === "hall") return a.hall.localeCompare(b.hall) || a.booth.localeCompare(b.booth);
    return a.booth.localeCompare(b.booth, undefined, {numeric:true});
  });
  return list;
}

function render() {
  const list = filtered();
  const grid = document.getElementById("grid");
  document.getElementById("count").textContent = `${list.length} booth${list.length !== 1 ? "s" : ""} found`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>No booths found</h3><p>Try a different search or category filter.</p></div>`;
    return;
  }

  grid.innerHTML = list.map(b => `
    <div class="card" data-booth="${b.booth}" tabindex="0" role="button" aria-label="${b.name} booth ${b.booth}">
      <div class="card-top">
        <div class="company-logo">${b.abbr || initials(b.name)}</div>
        <span class="booth-badge">#${b.booth}</span>
      </div>
      <div class="company-name">${b.name}</div>
      <span class="category-tag ${CAT_CLASS[b.cat] || ''}">${b.cat}</span>
      <p class="desc">${b.desc.length > 100 ? b.desc.slice(0,100)+"…" : b.desc}</p>
      <div class="hall-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        ${b.hall}
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openModal(card.dataset.booth));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openModal(card.dataset.booth); });
  });
}

function openModal(boothNum) {
  const b = BOOTHS.find(x => x.booth === boothNum);
  if (!b) return;
  document.getElementById("m-logo").textContent = b.abbr || initials(b.name);
  document.getElementById("m-name").textContent = b.name;
  document.getElementById("m-booth").textContent = "Booth #" + b.booth;
  const catEl = document.getElementById("m-cat");
  catEl.textContent = b.cat;
  catEl.className = "category-tag " + (CAT_CLASS[b.cat] || "");
  document.getElementById("m-desc").textContent = b.desc;
  document.getElementById("m-hall").textContent = b.hall;
  document.getElementById("m-size").textContent = b.size;
  document.getElementById("m-boothnum").textContent = "#" + b.booth;
  document.getElementById("m-catval").textContent = b.cat;
  document.getElementById("m-tags").innerHTML = b.tags.map(t => `<span class="tag">${t}</span>`).join("");
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

// Events
document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; render(); });
document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.cat;
  render();
});
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

render();
</script>
</body>
</html>
